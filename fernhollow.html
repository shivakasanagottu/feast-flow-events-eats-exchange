<!doctype html>
<html lang="en">
<head>

<title>Fernhollow</title>
<meta name="description" content="A regenerative design studio. Wander through a night valley of flowers that grows as you move.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Antonio:wght@400&family=Manrope:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--u:min(calc(100vw/1600),calc(100vh/900));--cream:#f5efe2}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#020508;overflow:hidden}
body{color:var(--cream);font-family:Manrope,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
#valley{position:fixed;inset:0;z-index:1}
.js-canvas-container{position:absolute;inset:0}
.js-canvas-container canvas{display:block;width:100%!important;height:100%!important}
.lil-gui{display:none!important}
.ui{position:fixed;inset:0;z-index:2;pointer-events:none;opacity:0;transition:opacity 1.6s cubic-bezier(0.16, 1, 0.3, 1)}
.ui.on{opacity:1}
.ui a,.ui button{pointer-events:auto}
header{position:absolute;left:0;right:0;top:0;display:flex;align-items:center;justify-content:space-between;padding:calc(24*var(--u)) calc(44*var(--u)) 0}
.logo{font-size:calc(26*var(--u));font-weight:500;letter-spacing:-.02em}
nav{display:flex;align-items:center;gap:calc(44*var(--u));font-size:calc(14.5*var(--u));font-weight:500;letter-spacing:.16em;text-transform:uppercase}
nav a:not(.pill){transition:opacity .2s}nav a:not(.pill):hover{opacity:.6}
.pill{display:inline-flex;align-items:center;height:calc(46*var(--u));padding:0 calc(26*var(--u));border-radius:99px;background:var(--cream);color:#151510;transition:transform .25s, background .2s}
.pill:hover{transform:translateY(-1px);background:#fff}
.hero{position:absolute;left:0;right:0;top:50%;transform:translateY(-46%);display:flex;flex-direction:column;align-items:center;text-align:center}
h1{font:400 calc(158*var(--u))/.92 Antonio,"Arial Narrow",sans-serif;letter-spacing:-.012em;white-space:nowrap;text-shadow:0 0 35px rgba(245,239,226,0.18)}
.cap{margin-top:calc(48*var(--u));font-size:calc(20*var(--u));line-height:1.3;color:rgba(245,239,226,0.85)}
.go{display:grid;place-items:center;margin-top:calc(34*var(--u));width:calc(58*var(--u));height:calc(58*var(--u));border:1.5px solid var(--cream);border-radius:50%;transition:background .3s,color .3s,transform .3s;box-shadow:0 0 20px rgba(245,239,226,0.15)}
.go:hover{background:var(--cream);color:#151510;transform:scale(1.06)}
.go svg{width:calc(22*var(--u));height:calc(22*var(--u));fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.corner{position:absolute;right:calc(44*var(--u));bottom:calc(44*var(--u));display:flex;align-items:center;gap:calc(18*var(--u));font-size:calc(12.5*var(--u));font-weight:500;letter-spacing:.16em;text-transform:uppercase}
.corner i{width:1px;height:calc(26*var(--u));background:rgba(245,239,226,.45)}
.sound{display:grid;place-items:center;width:calc(28*var(--u));height:calc(28*var(--u));transition:transform .2s}
.sound:hover{transform:scale(1.1)}
.sound svg{width:100%;height:100%;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.sound .w{transition:opacity .3s}.sound[aria-pressed=false] .w{opacity:0}
.sound[aria-pressed=true] .x{opacity:0}
.loader{position:fixed;inset:0;z-index:3;display:grid;place-items:center;background:#020508;transition:opacity 1s ease;pointer-events:none}
.loader.gone{opacity:0}
.loader span{width:calc(9*var(--u));height:calc(9*var(--u));min-width:6px;min-height:6px;border-radius:50%;background:var(--cream);animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(.4);opacity:.4}}
a:focus-visible,button:focus-visible{outline:2px solid var(--cream);outline-offset:3px}
@media (max-width:820px){
  :root{--u:1px}
  header{padding:18px 18px 0}
  nav a:not(.pill){display:none}
  .pill{height:40px;padding:0 18px;font-size:12px}
  .hero{left:20px;right:20px}
  .corner{left:20px;justify-content:center}
  h1{font-size:clamp(64px,19vw,96px);white-space:normal}
  .cap{font-size:17px}
  .corner{right:20px;bottom:30px;font-size:11px}
}
@media (prefers-reduced-motion:reduce){.loader span{animation:none}}
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>
<div id="valley" aria-hidden="true"><div class="js-canvas-container"></div></div>
<div class="ui" id="ui">
  <header>
    <a class="logo" href="#" aria-label="Fernhollow">Fernhollow</a>
    <nav aria-label="Main"><a href="#">Work</a><a href="#">About</a><a href="#">Journal</a><a class="pill" href="#">Let’s talk</a></nav>
  </header>
  <section class="hero">
    <h1>Grown, not built.</h1>
    <p class="cap">Rooted in nature.<br>Built for what’s next.</p>
    <a class="go" href="#" id="go" aria-label="See our work"><svg viewBox="0 0 24 24"><path d="M4 12h16M14 6l6 6-6 6"/></svg></a>
  </section>
  <div class="corner"><span>Scroll to wander</span><i></i>
    <button class="sound" id="sound" aria-pressed="false" aria-label="Ambient sound"><svg viewBox="0 0 24 24"><path d="M4 9.5v5h3.5L12 18V6L7.5 9.5Z"/><path class="w" d="M15.5 9a4 4 0 0 1 0 6M18 6.5a7.5 7.5 0 0 1 0 11"/><path class="x" d="m16 10 4 4m0-4-4 4"/></svg></button>
  </div>
</div>
<div class="loader" id="loader"><span></span></div>

<script>
/**
 * Fernhollow — 3D Night Flower Valley Engine & Web Audio
 * Interactive procedural night flower valley with smooth camera path flight,
 * cursor point repulsion, bloom particle dispersal, and ambient soundscape.
 */

// --- 1. Synthesized Audio Engine (Ambient Night Valley Soundscape) ---
const audioStore = (function() {
  let ctx = null;
  let isInitialized = false;
  let isMuted = true;
  let masterGain = null;
  let filterNode = null;
  let oscillators = [];
  let noiseNode = null;

  function initAudio() {
    if (isInitialized) return;
    try {
      const AudioCtx = window.AudioContext || window.webkitAudioContext;
      ctx = new AudioCtx();
      masterGain = ctx.createGain();
      masterGain.gain.setValueAtTime(0.0001, ctx.currentTime);

      // Low-pass filter for hover transition muffling
      filterNode = ctx.createBiquadFilter();
      filterNode.type = 'lowpass';
      filterNode.frequency.setValueAtTime(2400, ctx.currentTime);
      filterNode.Q.setValueAtTime(1.5, ctx.currentTime);

      masterGain.connect(filterNode);
      filterNode.connect(ctx.destination);

      // Ambient night chords (Ethereal Harmonic Drone: D - A - E - F#)
      const freqs = [146.83, 220.00, 329.63, 369.99, 440.00];
      freqs.forEach((freq, idx) => {
        const osc = ctx.createOscillator();
        const oscGain = ctx.createGain();
        osc.type = idx % 2 === 0 ? 'sine' : 'triangle';
        osc.frequency.setValueAtTime(freq, ctx.currentTime);

        // Slow vibrato LFO
        const lfo = ctx.createOscillator();
        const lfoGain = ctx.createGain();
        lfo.frequency.setValueAtTime(0.12 + idx * 0.05, ctx.currentTime);
        lfoGain.gain.setValueAtTime(1.5, ctx.currentTime);
        lfo.connect(osc.frequency);
        lfo.start();

        oscGain.gain.setValueAtTime(0.045 / (idx + 1), ctx.currentTime);
        osc.connect(oscGain);
        oscGain.connect(masterGain);
        osc.start();
        oscillators.push(osc);
      });

      // Pink noise / night wind generator
      const bufferSize = ctx.sampleRate * 2;
      const noiseBuffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
      const output = noiseBuffer.getChannelData(0);
      let b0 = 0, b1 = 0, b2 = 0, b3 = 0, b4 = 0, b5 = 0, b6 = 0;
      for (let i = 0; i < bufferSize; i++) {
        const white = Math.random() * 2 - 1;
        b0 = 0.99886 * b0 + white * 0.0555179;
        b1 = 0.99332 * b1 + white * 0.0750759;
        b2 = 0.96900 * b2 + white * 0.1538520;
        b3 = 0.86650 * b3 + white * 0.3104856;
        b4 = 0.55000 * b4 + white * 0.5329522;
        b5 = -0.7616 * b5 - white * 0.0168980;
        output[i] = (b0 + b1 + b2 + b3 + b4 + b5 + b6 + white * 0.5362) * 0.04;
        b6 = white * 0.115926;
      }
      noiseNode = ctx.createBufferSource();
      noiseNode.buffer = noiseBuffer;
      noiseNode.loop = true;
      const windFilter = ctx.createBiquadFilter();
      windFilter.type = 'bandpass';
      windFilter.frequency.setValueAtTime(380, ctx.currentTime);
      windFilter.Q.setValueAtTime(1.0, ctx.currentTime);
      noiseNode.connect(windFilter);
      windFilter.connect(masterGain);
      noiseNode.start();

      isInitialized = true;
    } catch (e) {
      console.warn("AudioContext init postponed until gesture", e);
    }
  }

  function toggleMute() {
    if (!isInitialized) initAudio();
    if (ctx && ctx.state === 'suspended') ctx.resume();
    isMuted = !isMuted;
    const targetGain = isMuted ? 0.0001 : 0.45;
    if (masterGain && ctx) {
      masterGain.gain.cancelScheduledValues(ctx.currentTime);
      masterGain.gain.exponentialRampToValueAtTime(Math.max(0.0001, targetGain), ctx.currentTime + 0.6);
    }
    return isMuted;
  }

  function setMuffled(muffled) {
    if (!filterNode || !ctx) return;
    const targetFreq = muffled ? 340 : 2400;
    filterNode.frequency.cancelScheduledValues(ctx.currentTime);
    filterNode.frequency.exponentialRampToValueAtTime(targetFreq, ctx.currentTime + 0.8);
  }

  return () => ({
    initAudio,
    toggleMute,
    setMuffled,
    get isInitialized() { return isInitialized; },
    get isMuted() { return isMuted; }
  });
})();

// --- 2. Interactive 3D Night Flower Valley Class ---
class ValleyScene {
  constructor(container, onLoaded, onIntroDone) {
    this.container = container;
    this.onLoaded = onLoaded;
    this.onIntroDone = onIntroDone;
    this.isHovering = false;
    this.hoverProgress = 0; // 0 = valley, 1 = dispersed glowing embers
    this.time = 0;
    this.scrollProgress = 0;
    this.targetScrollProgress = 0;
    this.mouse = { x: 0, y: 0, targetX: 0, targetY: 0 };
    this.isLoaded = false;
    this.introCalled = false;

    this.init();
  }

  init() {
    const w = window.innerWidth;
    const h = window.innerHeight;

    // Scene & Fog
    this.scene = new THREE.Scene();
    this.scene.background = new THREE.Color(0x020508);
    this.scene.fog = new THREE.FogExp2(0x020508, 0.016);

    // Camera
    this.camera = new THREE.PerspectiveCamera(55, w / h, 0.1, 1000);

    // Renderer
    this.renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false, powerPreference: 'high-performance' });
    this.renderer.setSize(w, h);
    this.renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    this.renderer.toneMapping = THREE.ACESFilmicToneMapping;
    this.renderer.toneMappingExposure = 1.35;

    const canvasWrapper = this.container.querySelector('.js-canvas-container');
    canvasWrapper.appendChild(this.renderer.domElement);

    // Camera Path Spline (Winding flight along valley)
    this.cameraCurve = new THREE.CatmullRomCurve3([
      new THREE.Vector3(0, 5, 45),
      new THREE.Vector3(12, 3.8, 25),
      new THREE.Vector3(-10, 4.2, 5),
      new THREE.Vector3(8, 3.2, -15),
      new THREE.Vector3(-14, 4.8, -35),
      new THREE.Vector3(6, 3.5, -55),
      new THREE.Vector3(0, 5, -75),
      new THREE.Vector3(10, 4, -95)
    ]);
    this.cameraCurve.closed = true;

    // Create Valley Terrain & Glowing Flora
    this.createTerrain();
    this.createFlowersAndLeaves();
    this.createAtmosphereParticles();

    // Lighting
    const ambientLight = new THREE.AmbientLight(0x0f231e, 0.8);
    this.scene.add(ambientLight);

    const moonLight = new THREE.DirectionalLight(0xdcfce7, 1.2);
    moonLight.position.set(20, 40, 20);
    this.scene.add(moonLight);

    // Events
    this.bindEvents();

    // Notify ready
    setTimeout(() => {
      this.isLoaded = true;
      if (this.onLoaded) this.onLoaded();
      setTimeout(() => {
        if (!this.introCalled && this.onIntroDone) {
          this.introCalled = true;
          this.onIntroDone();
        }
      }, 350);
    }, 450);

    // Animation Loop
    this.animate = this.animate.bind(this);
    requestAnimationFrame(this.animate);
  }

  // Soft undulating terrain
  createTerrain() {
    const geo = new THREE.PlaneGeometry(160, 240, 100, 100);
    geo.rotateX(-Math.PI / 2);

    const pos = geo.attributes.position;
    for (let i = 0; i < pos.count; i++) {
      const x = pos.getX(i);
      const z = pos.getZ(i);
      // Valley depression along center, hills on sides
      const valleyTrough = Math.pow(Math.abs(x) / 38, 2) * 9.5;
      const undulation = Math.sin(x * 0.08) * Math.cos(z * 0.08) * 2.5 + Math.sin(z * 0.04) * 3.5;
      pos.setY(i, valleyTrough + undulation - 4);
    }
    geo.computeVertexNormals();

    const mat = new THREE.MeshStandardMaterial({
      color: 0x04110d,
      roughness: 0.9,
      metalness: 0.1,
      flatShading: true
    });

    this.terrain = new THREE.Mesh(geo, mat);
    this.scene.add(this.terrain);
  }

  // Procedural Glowing Flowers & Leaves (Point Sprite Clouds with Bloom)
  createFlowersAndLeaves() {
    const count = 9500;
    const geometry = new THREE.BufferGeometry();
    const positions = new Float32Array(count * 3);
    const originalPositions = new Float32Array(count * 3);
    const dispersedPositions = new Float32Array(count * 3);
    const colors = new Float32Array(count * 3);
    const sizes = new Float32Array(count);
    const phases = new Float32Array(count);

    // Glowing Palette: Cream #f5efe2, soft mint #a7f3d0, pale buttercup #fef08a, ethereal violet #c4b5fd
    const palette = [
      new THREE.Color(0xf5efe2), // Cream
      new THREE.Color(0xfffbeb), // Warm White
      new THREE.Color(0xa7f3d0), // Mint glow
      new THREE.Color(0x6ee7b7), // Emerald
      new THREE.Color(0xfef08a), // Buttercup
      new THREE.Color(0xe9d5ff)  // Soft lilac
    ];

    for (let i = 0; i < count; i++) {
      // Scatter along the terrain
      const x = (Math.random() - 0.5) * 110;
      const z = (Math.random() - 0.5) * 190;
      const valleyHeight = Math.pow(Math.abs(x) / 38, 2) * 9.5;
      const undulation = Math.sin(x * 0.08) * Math.cos(z * 0.08) * 2.5 + Math.sin(z * 0.04) * 3.5;
      const y = valleyHeight + undulation - 3.2 + Math.random() * 1.8;

      positions[i * 3] = x;
      positions[i * 3 + 1] = y;
      positions[i * 3 + 2] = z;

      originalPositions[i * 3] = x;
      originalPositions[i * 3 + 1] = y;
      originalPositions[i * 3 + 2] = z;

      // Dispersed floating positions for hover transition
      const spread = 45;
      dispersedPositions[i * 3] = x + (Math.random() - 0.5) * spread;
      dispersedPositions[i * 3 + 1] = y + 8 + Math.random() * 28;
      dispersedPositions[i * 3 + 2] = z + (Math.random() - 0.5) * spread;

      // Color selection
      const color = palette[Math.floor(Math.random() * palette.length)];
      colors[i * 3] = color.r;
      colors[i * 3 + 1] = color.g;
      colors[i * 3 + 2] = color.b;

      // Sizes: flowers bloom larger nearer path
      const distFromCenter = Math.abs(x);
      sizes[i] = distFromCenter < 20 ? (Math.random() * 3.2 + 2.2) : (Math.random() * 2.0 + 1.2);
      phases[i] = Math.random() * Math.PI * 2;
    }

    geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
    geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));
    geometry.setAttribute('size', new THREE.BufferAttribute(sizes, 1));

    this.flowerOrigPos = originalPositions;
    this.flowerDispPos = dispersedPositions;
    this.flowerPhases = phases;
    this.flowerSizes = sizes;

    // Glowing Flower Point-Sprite Canvas Texture
    const canvas = document.createElement('canvas');
    canvas.width = 64;
    canvas.height = 64;
    const ctx = canvas.getContext('2d');

    // Outer soft aura
    const grad = ctx.createRadialGradient(32, 32, 0, 32, 32, 32);
    grad.addColorStop(0, 'rgba(255, 255, 255, 1)');
    grad.addColorStop(0.25, 'rgba(245, 239, 226, 0.9)');
    grad.addColorStop(0.55, 'rgba(167, 243, 208, 0.4)');
    grad.addColorStop(1, 'rgba(2, 5, 8, 0)');
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, 64, 64);

    // Central bright stamen
    ctx.beginPath();
    ctx.arc(32, 32, 6, 0, Math.PI * 2);
    ctx.fillStyle = '#ffffff';
    ctx.fill();

    const spriteTexture = new THREE.CanvasTexture(canvas);

    // Shader Material for blooming and cursor interactive illumination
    this.flowerMaterial = new THREE.PointsMaterial({
      size: 2.8,
      map: spriteTexture,
      vertexColors: true,
      transparent: true,
      opacity: 0.92,
      blending: THREE.AdditiveBlending,
      depthWrite: false
    });

    this.flowerParticles = new THREE.Points(geometry, this.flowerMaterial);
    this.scene.add(this.flowerParticles);
  }

  // Floating Dust & Firefly Spores
  createAtmosphereParticles() {
    const count = 1200;
    const geo = new THREE.BufferGeometry();
    const pos = new Float32Array(count * 3);
    const col = new Float32Array(count * 3);

    for (let i = 0; i < count; i++) {
      pos[i * 3] = (Math.random() - 0.5) * 90;
      pos[i * 3 + 1] = Math.random() * 25 + 1;
      pos[i * 3 + 2] = (Math.random() - 0.5) * 160;

      // Soft amber/gold firefly glow
      col[i * 3] = 0.98;
      col[i * 3 + 1] = 0.92;
      col[i * 3 + 2] = 0.65;
    }

    geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
    geo.setAttribute('color', new THREE.BufferAttribute(col, 3));

    const mat = new THREE.PointsMaterial({
      size: 1.4,
      vertexColors: true,
      transparent: true,
      opacity: 0.75,
      blending: THREE.AdditiveBlending,
      depthWrite: false
    });

    this.dustParticles = new THREE.Points(geo, mat);
    this.scene.add(this.dustParticles);
  }

  bindEvents() {
    // Wheel Virtual Scroller
    window.addEventListener('wheel', (e) => {
      this.targetScrollProgress += e.deltaY * 0.00035;
    }, { passive: true });

    // Touch Virtual Scroller (20x multiplier as specified)
    let touchStartY = 0;
    window.addEventListener('touchstart', (e) => {
      if (e.touches.length > 0) touchStartY = e.touches[0].clientY;
    }, { passive: true });

    window.addEventListener('touchmove', (e) => {
      if (e.touches.length > 0) {
        const delta = touchStartY - e.touches[0].clientY;
        touchStartY = e.touches[0].clientY;
        this.targetScrollProgress += delta * 0.00035 * 20; // 20x touch multiplier
      }
    }, { passive: true });

    // Mouse movement
    window.addEventListener('pointermove', (e) => {
      this.mouse.targetX = (e.clientX / window.innerWidth) * 2 - 1;
      this.mouse.targetY = -(e.clientY / window.innerHeight) * 2 + 1;
    });

    // Resize
    window.addEventListener('resize', () => {
      const w = window.innerWidth;
      const h = window.innerHeight;
      this.camera.aspect = w / h;
      this.camera.updateProjectionMatrix();
      this.renderer.setSize(w, h);
    });
  }

  // Hover Transition on Arrow Button: eases flight, disperses into glowing particles, muffles sound
  startHoverTransition() {
    this.isHovering = true;
    audioStore().setMuffled(true);
  }

  stopHoverTransition() {
    this.isHovering = false;
    audioStore().setMuffled(false);
  }

  animate() {
    requestAnimationFrame(this.animate);
    this.time += 0.016;

    // Smooth hover progress interpolation
    const hoverTarget = this.isHovering ? 1.0 : 0.0;
    this.hoverProgress += (hoverTarget - this.hoverProgress) * 0.045;

    // Smooth mouse interpolation
    this.mouse.x += (this.mouse.targetX - this.mouse.x) * 0.05;
    this.mouse.y += (this.mouse.targetY - this.mouse.y) * 0.05;

    // Idle drift: when not hovering, continuously drift forward
    const driftSpeed = 0.00028 * (1.0 - this.hoverProgress * 0.95);
    this.targetScrollProgress += driftSpeed;

    // Smooth scroll interpolation
    this.scrollProgress += (this.targetScrollProgress - this.scrollProgress) * 0.06;

    // Modulo for seamless looping spline flight
    const loopT = ((this.scrollProgress % 1.0) + 1.0) % 1.0;
    const lookAheadT = ((loopT + 0.02) % 1.0 + 1.0) % 1.0;

    const camPos = this.cameraCurve.getPointAt(loopT);
    const lookAtPos = this.cameraCurve.getPointAt(lookAheadT);

    // Camera tilt toward mouse
    this.camera.position.set(
      camPos.x + this.mouse.x * 2.5,
      camPos.y + this.mouse.y * 1.8,
      camPos.z
    );

    lookAtPos.x += this.mouse.x * 4.5;
    lookAtPos.y += this.mouse.y * 3.2;
    this.camera.lookAt(lookAtPos);

    // Update Flower Positions & Repulsion field
    if (this.flowerParticles) {
      const posAttr = this.flowerParticles.geometry.attributes.position;
      const posArr = posAttr.array;
      const orig = this.flowerOrigPos;
      const disp = this.flowerDispPos;
      const count = posArr.length / 3;

      // Mouse repulsion vector in world space near camera
      const raycaster = new THREE.Raycaster();
      raycaster.setFromCamera(new THREE.Vector2(this.mouse.x, this.mouse.y), this.camera);
      const cursorPoint = raycaster.ray.at(18, new THREE.Vector3());

      const hp = this.hoverProgress;

      for (let i = 0; i < count; i++) {
        const i3 = i * 3;
        const phase = this.flowerPhases[i];

        // Base location interpolated between valley & floating particles
        let bx = orig[i3] * (1 - hp) + disp[i3] * hp;
        let by = orig[i3 + 1] * (1 - hp) + disp[i3 + 1] * hp;
        let bz = orig[i3 + 2] * (1 - hp) + disp[i3 + 2] * hp;

        // Gentle breathing wind sway
        bx += Math.sin(this.time * 1.2 + phase) * 0.25;
        by += Math.cos(this.time * 0.9 + phase) * (0.2 + hp * 0.8);

        // Cursor Repulsion in 3D: pushes flowers away from mouse ray
        const dx = bx - cursorPoint.x;
        const dy = by - cursorPoint.y;
        const dz = bz - cursorPoint.z;
        const distSq = dx * dx + dy * dy + dz * dz;

        if (distSq < 120) {
          const dist = Math.sqrt(distSq);
          const force = (1 - dist / 11) * 3.8;
          bx += (dx / dist) * force;
          by += (dy / dist) * force;
          bz += (dz / dist) * force;
        }

        posArr[i3] = bx;
        posArr[i3 + 1] = by;
        posArr[i3 + 2] = bz;
      }
      posAttr.needsUpdate = true;
    }

    // Gentle dust swirl
    if (this.dustParticles) {
      const pos = this.dustParticles.geometry.attributes.position.array;
      for (let i = 1; i < pos.length; i += 3) {
        pos[i] += Math.sin(this.time * 0.5 + i) * 0.03;
      }
      this.dustParticles.geometry.attributes.position.needsUpdate = true;
    }

    this.renderer.render(this.scene, this.camera);
  }
}

// --- 3. Engine Boot & UI Wiring ---
document.addEventListener('DOMContentLoaded', () => {
  const loader = document.getElementById('loader');
  const ui = document.getElementById('ui');
  const sound = document.getElementById('sound');
  const go = document.getElementById('go');

  let introShown = false;

  // Instantiate the Valley Engine
  const valley = new ValleyScene(
    document.getElementById('valley'),
    () => loader.classList.add('gone'), // onLoaded
    () => {
      if (!introShown) {
        introShown = true;
        ui.classList.add('on');
      }
    }
  );

  // Audio store interaction
  const s = audioStore();
  s.initAudio();

  sound.addEventListener('click', () => {
    const isMuted = s.toggleMute();
    sound.setAttribute('aria-pressed', String(!isMuted));
  });

  // Hover transition on the arrow button: eases camera flight, disperses flowers, muffles sound
  go.addEventListener('pointerenter', () => valley.startHoverTransition());
  go.addEventListener('pointerleave', () => valley.stopHoverTransition());
});
</script>
